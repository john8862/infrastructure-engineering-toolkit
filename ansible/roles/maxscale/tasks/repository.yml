---
- name: Validate the MaxScale repository platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - maxscale_repository_url is match('^https://')
      - maxscale_repository_key_url is match('^https://')
    fail_msg: MaxScale repository management requires a Debian-family host and HTTPS repository/key URLs.

- name: Install repository bootstrap packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: "{{ maxscale_apt_cache_valid_time }}"

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: "{{ maxscale_repository_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the official MariaDB repository key
  ansible.builtin.get_url:
    url: "{{ maxscale_repository_key_url }}"
    dest: "{{ maxscale_repository_keyring }}.download"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Inspect the downloaded MariaDB repository key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ maxscale_repository_keyring }}.download"
  register: maxscale_repository_key_details
  changed_when: false
  check_mode: false
  no_log: true

- name: Verify the pinned MariaDB repository key fingerprint
  ansible.builtin.assert:
    that:
      - maxscale_repository_key_details.stdout | lower is search(maxscale_repository_key_fingerprint | lower)
    fail_msg: The downloaded MariaDB repository key does not match the pinned public fingerprint.
  no_log: true

- name: Install the verified MariaDB repository keyring
  ansible.builtin.copy:
    src: "{{ maxscale_repository_keyring }}.download"
    remote_src: true
    dest: "{{ maxscale_repository_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the official MaxScale APT repository
  ansible.builtin.deb822_repository:
    name: "{{ maxscale_repository_filename }}"
    types: deb
    uris: "{{ maxscale_repository_url }}"
    suites: "{{ ansible_distribution_release }}"
    components: "{{ maxscale_repository_components }}"
    architectures: "{{ maxscale_repository_architectures }}"
    signed_by: "{{ maxscale_repository_keyring }}"
    enabled: true
    state: present

- name: Refresh APT metadata after the repository declaration
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
