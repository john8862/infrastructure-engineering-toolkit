---
# Public, vendor-neutral MaxScale configuration role.
#
# The defaults are deliberately conservative: repository/package/service
# changes are opt-in, while rendering and validation can be exercised in a
# disposable test host.  Credentials and certificate material are always
# supplied by the caller; this role never creates database or MaxScale users.

maxscale_enabled: true
maxscale_manage_repository: false
maxscale_manage_package: false
maxscale_manage_service: false
maxscale_package_name: maxscale
maxscale_package_state: present
maxscale_service_name: maxscale
maxscale_service_user: maxscale
maxscale_service_group: maxscale

maxscale_allow_unsupported_platform: false
maxscale_supported_distribution: Ubuntu
maxscale_supported_releases:
  - jammy
  - noble

# Official MariaDB MaxScale repository integration.  The role links to the
# vendor repository and verifies its public key fingerprint; it does not
# redistribute MaxScale packages or vendor legal text.
maxscale_repository_series: "24.02"
maxscale_repository_url: "https://dlm.mariadb.com/repo/maxscale/{{ maxscale_repository_series }}/apt"
maxscale_repository_components:
  - main
maxscale_repository_architectures:
  - amd64
  - arm64
maxscale_repository_key_url: "https://supplychain.mariadb.com/mariadb-keyring-2025.gpg"
maxscale_repository_keyring: /etc/apt/keyrings/mariadb-maxscale.gpg
maxscale_repository_key_fingerprint: BB2A36F36C3B4D373BAC328A5D87FACA8C27D14E
maxscale_repository_filename: maxscale
maxscale_apt_cache_valid_time: 3600
maxscale_validate_package_version: true

maxscale_config_file: /etc/maxscale.cnf
maxscale_config_dir: /etc/maxscale.cnf.d
maxscale_config_owner: root
maxscale_config_group: maxscale
maxscale_config_mode: "0640"
maxscale_config_dir_mode: "0750"
maxscale_config_backup: true
maxscale_config_backup_suffix: .ansible-backup
maxscale_config_validate_enabled: true
maxscale_config_validate_command: "{{ maxscale_binary }} --config-check --config=%s"
maxscale_binary: /usr/bin/maxscale
maxscale_maxctrl_binary: /usr/bin/maxctrl
maxscale_render_configuration: true

maxscale_data_directory: /var/lib/maxscale
maxscale_log_directory: /var/log/maxscale
maxscale_run_directory: /run/maxscale
maxscale_cache_directory: /var/cache/maxscale
maxscale_persist_directory: "{{ maxscale_data_directory }}/persist"
maxscale_certificate_directory: /etc/maxscale/certs
maxscale_certificate_directory_owner: root
maxscale_certificate_directory_group: "{{ maxscale_service_group }}"

maxscale_global_options:
  threads: auto
  datadir: "{{ maxscale_data_directory }}"
  logdir: "{{ maxscale_log_directory }}"
  piddir: "{{ maxscale_run_directory }}"
  cachedir: "{{ maxscale_cache_directory }}"
  persistdir: "{{ maxscale_persist_directory }}"
  persist_runtime_changes: true

maxscale_admin_enabled: true
maxscale_admin_host: 127.0.0.1
maxscale_admin_port: 8989
maxscale_admin_auth: true
maxscale_admin_secure_gui: true
maxscale_admin_tls_enabled: false
maxscale_admin_tls_cert: ""
maxscale_admin_tls_key: ""
maxscale_admin_tls_ca: ""
maxscale_admin_tls_verify_peer: false

maxscale_logging_options:
  maxlog: true
  syslog: false
maxscale_logging_extra_options: {}
maxscale_logrotate_enabled: true
maxscale_logrotate_file: /etc/logrotate.d/maxscale
maxscale_logrotate_files:
  - "{{ maxscale_log_directory }}/*.log"
maxscale_logrotate_frequency: daily
maxscale_logrotate_rotate: 14
maxscale_logrotate_compress: true
maxscale_logrotate_delaycompress: true
maxscale_logrotate_missingok: true
maxscale_logrotate_notifempty: true
maxscale_logrotate_create_mode: "0640"
maxscale_logrotate_create_owner: "{{ maxscale_service_user }}"
maxscale_logrotate_create_group: "{{ maxscale_service_group }}"
maxscale_logrotate_postrotate_command: "{{ maxscale_maxctrl_binary }} rotate logs"

# Each object is a data-only definition.  The options map is rendered as
# supplied so callers can use documented MaxScale settings without a role
# release.  No database accounts or passwords are generated by this role.
maxscale_servers: []
maxscale_monitors: []
maxscale_services: []
maxscale_listeners: []
maxscale_allowed_monitor_modules:
  - mariadbmon
  - mysqlmon
  - galeramon
maxscale_allowed_service_routers:
  - readwritesplit
  - readconnroute
  - schemarouter

# Optional external credential references.  Values should normally be
# populated from Vault or another secret manager in the calling playbook.
maxscale_credentials: {}
maxscale_render_credentials: false

# TLS paths refer to files provisioned by an external PKI workflow.  The role
# validates paths and basic pairing only; it never creates, copies, or edits
# certificates, private keys, trust stores, or keytabs.
maxscale_tls_validate_paths: true
maxscale_tls_validate_hostname: false
maxscale_tls_expected_hostname: ""
maxscale_tls_require_ca_for_peer_verification: true

# Optional systemd/logging policy.
maxscale_systemd_override_enabled: false
maxscale_systemd_override_file: "/etc/systemd/system/{{ maxscale_service_name }}.service.d/override.conf"
maxscale_systemd_restart: on-failure
maxscale_systemd_restart_sec: 5s
maxscale_systemd_timeout_start_sec: ""
maxscale_systemd_timeout_stop_sec: ""
maxscale_systemd_limit_nofile: ""
maxscale_systemd_environment: {}

# Safe reload and health validation.  Health validation is only attempted
# after a managed service is active and never bootstraps an admin account.
maxscale_reload_on_change: true
maxscale_health_check_enabled: false
maxscale_health_check_url: "http://127.0.0.1:8989/v1/maxscale"
maxscale_health_check_status_code: 200
maxscale_health_check_timeout: 5
maxscale_health_check_user: ""
maxscale_health_check_password: ""
maxscale_health_check_validate_certs: true

# Host firewall integration is opt-in and uses an already managed UFW policy.
# The role never enables or resets a firewall.
maxscale_firewall_enabled: false
maxscale_firewall_rules: []
maxscale_firewall_allow_sources: []
maxscale_firewall_include_listener_ports: true
maxscale_firewall_include_admin_port: false
