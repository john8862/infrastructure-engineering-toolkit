---
- name: Gather final MariaDB state
  ansible.mariadb.mariadb_info:
    login_user: "{{ mariadb_admin_login_user }}"
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
    connect_timeout: "{{ mariadb_admin_connect_timeout }}"
    filter:
      - version
      - users_info
      - slave_status
    return_empty_dbs: true
  register: mariadb_final_info
  no_log: true

- name: Read final MariaDB baseline settings
  ansible.mariadb.mariadb_query:
    login_user: "{{ mariadb_admin_login_user }}"
    login_password: "{{ mariadb_root_password }}"
    login_unix_socket: "{{ mariadb_socket }}"
    connect_timeout: "{{ mariadb_admin_connect_timeout }}"
    query:
      - >-
        SELECT @@global.server_id AS server_id,
        @@global.report_host AS report_host,
        @@global.gtid_domain_id AS gtid_domain_id,
        @@global.gtid_strict_mode AS gtid_strict_mode,
        @@global.gtid_slave_pos AS gtid_slave_pos,
        @@global.gtid_binlog_pos AS gtid_binlog_pos,
        @@global.log_bin AS log_bin,
        @@global.binlog_format AS binlog_format,
        @@global.binlog_row_image AS binlog_row_image,
        @@global.require_secure_transport AS require_secure_transport,
        @@global.bind_address AS bind_address,
        @@global.skip_name_resolve AS skip_name_resolve,
        @@global.max_connections AS max_connections,
        @@global.character_set_server AS character_set_server,
        @@global.collation_server AS collation_server
  register: mariadb_final_query
  changed_when: false
  check_mode: false
  no_log: true

- name: Normalize final MariaDB state
  ansible.builtin.set_fact:
    mariadb_final_state: "{{ mariadb_final_query.query_result[0][0] }}"
    mariadb_final_replication_account_info: >-
      {{ mariadb_final_info.users_info | default([])
         | selectattr('name', 'equalto', mariadb_replication_user)
         | selectattr('host', 'equalto', mariadb_replication_host)
         | list }}
    mariadb_final_unexpected_users: >-
      {{ mariadb_final_info.users_info | default([])
         | rejectattr('name', 'in', mariadb_bootstrap_system_users)
         | rejectattr('name', 'equalto', mariadb_replication_user)
         | list }}
  no_log: true

- name: Read the final Ready-for-HA marker
  ansible.builtin.stat:
    path: "{{ mariadb_bootstrap_marker }}"
  register: mariadb_final_marker_stat

- name: Verify stable MariaDB TLS links when TLS is enabled
  ansible.builtin.stat:
    path: "{{ item.destination }}"
    follow: false
  loop: "{{ mariadb_tls_asset_links }}"
  loop_control:
    label: "{{ item.name }}"
  register: mariadb_final_tls_links
  no_log: true
  when: mariadb_tls_enabled | bool

- name: Assert stable MariaDB TLS links exist when TLS is enabled
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.islnk
    fail_msg: >-
      MariaDB TLS link {{ item.item.name }} is missing from the stable
      MariaDB certificate directory.
  loop: "{{ mariadb_final_tls_links.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
  when: mariadb_tls_enabled | bool

- name: Verify managed MariaDB TLS links are absent when TLS is disabled
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ mariadb_tls_asset_links | map(attribute='destination') | list }}"
  register: mariadb_final_disabled_tls_links
  no_log: true
  when: not (mariadb_tls_enabled | bool)

- name: Assert managed MariaDB TLS links are absent when TLS is disabled
  ansible.builtin.assert:
    that:
      - not item.stat.islnk | default(false) | bool
    fail_msg: >-
      Managed MariaDB TLS link {{ item.item }} still exists while TLS is
      disabled.
  loop: "{{ mariadb_final_disabled_tls_links.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (mariadb_tls_enabled | bool)

- name: Assert the MariaDB Ready-for-HA contract
  ansible.builtin.assert:
    that:
      - (mariadb_final_info.version.full | regex_search('^[0-9]+\\.[0-9]+')) == mariadb_server_version
      - mariadb_final_state.server_id | int == mariadb_server_id_effective | int
      - mariadb_final_state.report_host | string == mariadb_report_host_effective | string
      - mariadb_final_state.gtid_domain_id | int == mariadb_gtid_domain_id | int
      - mariadb_final_state.gtid_strict_mode | string | lower in ['1', 'on']
      - mariadb_final_state.log_bin | string | lower in ['1', 'on']
      - mariadb_final_state.binlog_format | upper == 'ROW'
      - mariadb_final_state.binlog_row_image | upper == 'FULL'
      - not (mariadb_tls_enabled | bool)
        or mariadb_final_state.require_secure_transport | string | lower in ['1', 'on']
      - mariadb_tls_enabled | bool
        or mariadb_final_state.require_secure_transport | string | lower in ['0', 'off']
      - mariadb_final_state.bind_address == mariadb_bind_address
      - mariadb_final_state.skip_name_resolve | string | lower in ['1', 'on']
      - mariadb_final_state.max_connections | int == mariadb_max_connections | int
      - mariadb_final_state.character_set_server == mariadb_character_set_server
      - mariadb_final_state.collation_server == mariadb_collation_server
      - mariadb_final_state.gtid_slave_pos | default('') | string | length == 0
      - (mariadb_final_info.slave_status | default({})) | length == 0
      - mariadb_final_replication_account_info | length == 1
      - mariadb_final_replication_account_info[0].priv is search('REPLICATION SLAVE')
      - mariadb_final_replication_account_info[0].tls_requires is defined
      - mariadb_final_replication_account_info[0].tls_requires | string | upper is search('SSL')
      - mariadb_final_unexpected_users | length == 0
      - mariadb_final_marker_stat.stat.exists
      - not (mariadb_bootstrap_should_reset | bool)
        or mariadb_final_state.gtid_binlog_pos | default('') | string | length == 0
    fail_msg: >-
      MariaDB did not satisfy the Ready-for-HA contract. Inspect the rendered
      configuration and server state before introducing a future HA role.
