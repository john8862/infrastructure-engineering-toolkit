---
- name: Assert the supported operating system
  ansible.builtin.assert:
    that:
      - mariadb_target_distribution == 'Ubuntu'
      - mariadb_target_distribution_version is match('^[0-9]+\\.[0-9]+$')
      - ansible_facts.distribution == mariadb_target_distribution
      - (ansible_facts.distribution_version | regex_search('^[0-9]+\\.[0-9]+')) == mariadb_target_distribution_version
      - ansible_facts.distribution_release == mariadb_target_distribution_release
      - mariadb_repository_distribution == mariadb_target_distribution_release
    fail_msg: >-
      This role targets {{ mariadb_target_distribution }}
      {{ mariadb_target_distribution_version }}
      ({{ mariadb_target_distribution_release }}). Found
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      ({{ ansible_facts.distribution_release }}).
  tags:
    - always

- name: Assert official MariaDB repository inputs
  ansible.builtin.assert:
    that:
      - mariadb_server_version is match('^[0-9]+\\.[0-9]+$')
      - mariadb_repository_version == mariadb_server_version
      - mariadb_repository_keyring_url is match('^https://')
      - mariadb_repository_keyring_path is match('^/etc/apt/keyrings/')
      - mariadb_repository_key_fingerprint | length == 40
      - "'gnupg' in mariadb_repository_prerequisite_packages"
      - "'python3-debian' in mariadb_repository_prerequisite_packages"
    fail_msg: >-
      MariaDB {{ mariadb_server_version }} must be installed from the official
      MariaDB repository with its managed keyring. Do not substitute Ubuntu's
      MariaDB packages, and keep the repository series equal to the selected
      server series.
  tags:
    - always

- name: Assert required credentials are supplied
  ansible.builtin.assert:
    that:
      - mariadb_root_password | string | length > 0
      - mariadb_replication_password | string | length > 0
    fail_msg: >-
      Supply mariadb_root_password and mariadb_replication_password from an
      encrypted Ansible Vault variable before applying this role.
  tags:
    - always

- name: Assert bootstrap safety inputs
  ansible.builtin.assert:
    that:
      - mariadb_bootstrap_existing_host_mode in ['fail', 'skip']
      - not (mariadb_bootstrap_reset_master | bool) or mariadb_bootstrap_new_server | bool
      - not (mariadb_bootstrap_reset_master | bool) or mariadb_bootstrap_existing_host_mode == 'fail'
      - mariadb_inventory_group in groups
      - inventory_hostname in groups[mariadb_inventory_group]
    fail_msg: >-
      Bootstrap reset requires an explicit new-server declaration, and every
      MariaDB host must belong to the configured inventory group.
  tags:
    - always

- name: Calculate the effective MariaDB node identity
  ansible.builtin.set_fact:
    mariadb_server_id_effective: >-
      {{ mariadb_server_id if mariadb_server_id is not none else
         mariadb_server_id_offset + groups[mariadb_inventory_group].index(inventory_hostname) + 1 }}
    mariadb_report_host_effective: >-
      {{ mariadb_report_host | default(ansible_facts.fqdn, true) |
         default(inventory_hostname, true) }}
  tags:
    - always

- name: Assert the effective MariaDB node identity is valid
  ansible.builtin.assert:
    that:
      - mariadb_server_id_effective | int > 0
      - mariadb_server_id_effective | int <= 4294967295
      - mariadb_gtid_domain_id | int >= 0
      - mariadb_gtid_domain_id | int <= 4294967295
      - mariadb_report_host_effective | string | length > 0
    fail_msg: The derived MariaDB server identity is invalid.
  tags:
    - always

- name: Calculate whether TLS source paths are complete
  ansible.builtin.set_fact:
    mariadb_tls_asset_inputs_complete: >-
      {{ (mariadb_tls_asset_links
          | selectattr('source', 'defined')
          | selectattr('source', 'match', '^/')
          | list
          | length) == (mariadb_tls_asset_links | length) }}
  when: mariadb_tls_enabled | bool
  no_log: true
  tags:
    - configure
    - validate

- name: Assert the MariaDB TLS consumer interface when TLS is enabled
  ansible.builtin.assert:
    that:
      - mariadb_ssl_directory | string | length > 0
      - mariadb_ssl_directory is match('^/')
      - mariadb_tls_asset_links | length == 3
      - (mariadb_tls_asset_links | map(attribute='destination') | list) == [
          mariadb_tls_ca_certificate_link,
          mariadb_tls_server_certificate_link,
          mariadb_tls_server_private_key_link
        ]
      - item.source | string | length > 0
      - item.source is match('^/')
      - item.destination | string | length > 0
      - item.destination is match('^/')
      - item.source != item.destination
    fail_msg: >-
      TLS is enabled but the external certificate interface or stable MariaDB
      link paths are incomplete.
  loop: "{{ mariadb_tls_asset_links }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when:
    - mariadb_tls_enabled | bool
    - not (
        ansible_check_mode
        and not (mariadb_tls_asset_inputs_complete | default(false) | bool)
      )
  tags:
    - configure
    - validate

- name: Assert supported replication and logging values
  ansible.builtin.assert:
    that:
      - mariadb_binlog_format == 'ROW'
      - mariadb_binlog_row_image == 'FULL'
      - mariadb_log_bin | bool
      - mariadb_replication_user == 'replication'
      - mariadb_replication_privileges == '*.*:REPLICATION SLAVE'
      # REQUIRE SSL is an account policy; it does not imply a separate
      # replication certificate or stable replication link set.
      - "'SSL' in mariadb_replication_tls_requires"
      - mariadb_expire_logs_days | int >= 1
      - mariadb_max_connections | int >= 1
      - mariadb_slave_parallel_threads | int >= 0
  tags:
    - always

- name: Assert all database filters are explicit lists
  ansible.builtin.assert:
    that:
      - mariadb_binlog_do_db is iterable
      - mariadb_binlog_ignore_db is iterable
      - mariadb_replicate_do_db is iterable
      - mariadb_replicate_ignore_db is iterable
  tags:
    - always
